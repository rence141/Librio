name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FLUTTER_VERSION: '3.38.9'
  NODE_VERSION: '24.13.0'

jobs:
  # Flutter App Tests & Lint
  flutter-lint-and-test:
    name: Flutter - Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      
      - name: Run Flutter analyze
        working-directory: apps/mobile
        run: flutter analyze
      
      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test
        continue-on-error: true
      
      - name: Check code formatting
        working-directory: apps/mobile
        run: dart format --set-exit-if-changed .
        continue-on-error: true

  # Node.js API Tests & Lint
  nodejs-lint-and-test:
    name: Node.js API - Lint & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: librio
          POSTGRES_PASSWORD: librio
          POSTGRES_DB: librio_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'services/api/package-lock.json'
      
      - name: Install dependencies
        working-directory: services/api
        run: npm ci
      
      - name: Run linter
        working-directory: services/api
        run: npm run lint
        continue-on-error: true
      
      - name: Build TypeScript
        working-directory: services/api
        run: npm run build
      
      - name: Run tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://librio:librio@localhost:5432/librio_test
          JWT_SECRET: test_secret_key_min_32_chars_long_here
          JWT_REFRESH_SECRET: test_refresh_secret_key_min_32_chars_long
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SECRET_KEY: test_secret_key_here
        run: npm test
        continue-on-error: true

  # Security Checks
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
        continue-on-error: true
      
      - name: Check .env files not committed
        run: |
          if git ls-files | grep -E '\.env$|\.env\.[^e]'; then
            echo "ERROR: .env files found in git!"
            exit 1
          fi
        continue-on-error: true

  # Build Flutter APK (for Android)
  flutter-build-android:
    name: Flutter - Build Android APK
    runs-on: ubuntu-latest
    needs: flutter-lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      
      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: librio-release.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Build Node.js API Docker image
  nodejs-build-docker:
    name: Node.js API - Build Docker Image
    runs-on: ubuntu-latest
    needs: nodejs-lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/api
          push: false
          tags: librio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Summary
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [flutter-lint-and-test, nodejs-lint-and-test, security]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.flutter-lint-and-test.result }}" = "failure" ] || \
             [ "${{ needs.nodejs-lint-and-test.result }}" = "failure" ] || \
             [ "${{ needs.security.result }}" = "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ CI Pipeline Passed"
