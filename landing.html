<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librio - AI Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 80px;
            max-width: 1200px;
            width: 100%;
        }

        .image-section {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .image-placeholder {
            width: 350px;
            height: 450px;
            background-color: #d0d0d0;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .content-section {
            flex: 1;
        }

        h1 {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #000;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .description {
            font-size: 16px;
            color: #555;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .cta-text {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            margin-bottom: 40px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: #000;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #333;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .btn-secondary {
            background-color: #fff;
            color: #000;
            border: 2px solid #000;
        }

        .btn-secondary:hover {
            background-color: #f5f5f5;
            transform: translateY(-2px);
        }

        .icon {
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 40px;
            }

            h1 {
                font-size: 36px;
            }

            .image-placeholder {
                width: 280px;
                height: 360px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Image Section -->
        <div class="image-section">
            <div class="image-placeholder">
                [Image goes here]
            </div>
        </div>

        <!-- Content Section -->
        <div class="content-section">
            <h1>Get The App</h1>
            
            <p class="subtitle">Are you ready to redefine your AI chat experience?</p>
            
            <p class="description">
                Set up an account in seconds, chat with AI and get instant answers. Track your usage, manage your subscription, anytime, anywhere.
            </p>
            
            <p class="cta-text">Time to own it.</p>
            
            <div class="button-group">
                <a href="#" class="btn btn-primary">
                    <span class="icon">🍎</span>
                    Download on App Store
                </a>
                <a href="#" class="btn btn-primary">
                    <span class="icon">▶️</span>
                    Get it on Google Play
                </a>
            </div>
        </div>
    </div>
</body>
</html>
