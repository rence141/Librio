<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="white"/>
  
  <!-- Main Logo: Stylized "L" with gradient -->
  <defs>
    <linearGradient id="gradientL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradientAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Vertical bar of "L" -->
  <path d="M 130 160 Q 140 160 150 170 L 150 380 Q 150 390 140 390 L 110 390 Q 100 390 100 380 L 100 170 Q 100 160 110 160 Z" 
        fill="url(#gradientL)" />
  
  <!-- Horizontal bar of "L" -->
  <path d="M 150 380 Q 150 390 160 400 L 340 400 Q 350 400 350 390 L 350 360 Q 350 350 340 350 L 160 350 Q 150 350 150 360 Z" 
        fill="url(#gradientAccent)" />
  
  <!-- Accent circle -->
  <circle cx="380" cy="280" r="50" fill="url(#gradientL)" opacity="0.3" />
  
  <!-- Accent dots -->
  <circle cx="420" cy="320" r="8" fill="#10B981" />
  <circle cx="400" cy="340" r="6" fill="#06B6D4" />
</svg>
