version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: librio-postgres
    environment:
      POSTGRES_USER: librio
      POSTGRES_PASSWORD: librio
      POSTGRES_DB: librio_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U librio']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
