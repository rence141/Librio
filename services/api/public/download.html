<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get The App - Librio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #e8e8e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        
        .container { display: flex; align-items: center; gap: 100px; max-width: 1400px; width: 100%; }
        
        .image-section { flex: 0 0 400px; }
        .phone-box { width: 350px; height: 450px; background: linear-gradient(135deg, #7B8C2E 0%, #CDDC39 100%); border-radius: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 60px rgba(0,0,0,0.2); }
        .phone-placeholder { color: #fff; font-size: 14px; text-align: center; }
        
        .content-section { flex: 1; }
        h1 { font-size: 56px; font-weight: 700; margin-bottom: 30px; color: #000; }
        .subtitle { font-size: 20px; color: #333; margin-bottom: 30px; line-height: 1.6; }
        .description { font-size: 18px; color: #555; margin-bottom: 40px; line-height: 1.8; }
        .cta { font-size: 20px; font-weight: 600; color: #000; }
        
        .buttons { display: flex; gap: 15px; margin-top: 40px; flex-wrap: wrap; }
        .btn { padding: 14px 32px; font-size: 16px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; }
        .btn-primary { background: #000; color: #fff; }
        .btn-primary:hover { background: #333; transform: translateY(-2px); }
        
        @media (max-width: 1024px) {
            .container { flex-direction: column; gap: 50px; }
            .image-section { flex: 0 0 auto; }
            h1 { font-size: 42px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <div class="phone-box">
                <div class="phone-placeholder">[Phone mockup image]</div>
            </div>
        </div>
        
        <div class="content-section">
            <h1>Get The App</h1>
            <p class="subtitle">Are you ready to redefine your shopping experience?</p>
            <p class="description">Set up an account in seconds, buy what you love and split your purchase into 3 easy payments. Track your payment schedule, anytime, anywhere.</p>
            <p class="cta">Time to own it.</p>
            
            <div class="buttons">
                <a href="https://apps.apple.com/" class="btn btn-primary">🍎 Download on App Store</a>
                <a href="https://play.google.com/" class="btn btn-primary">▶️ Get it on Google Play</a>
            </div>
        </div>
    </div>
</body>
</html>
